services:
  web: 
    build: .
    ports:
      - "5000:5000"
    depends_on: 
      redis: 
        condition: service_healthy
    environment: 
      REDIS_HOST: ${REDIS_HOST} 
      REDIS_PORT: ${REDIS_PORT} 

  redis: 
    image: "redis"
    volumes: 
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
