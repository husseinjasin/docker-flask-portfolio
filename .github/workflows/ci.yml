name: CI
  
on:
  push: 

jobs:
  test: 
    runs-on: ubuntu-latest

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    services:
      redis:
        image: redis 
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.9"
      - run: pip install -r requirements.txt
      - run: pytest -p no:cacheprovider
 
